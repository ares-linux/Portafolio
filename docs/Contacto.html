<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Ares</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <p class="eyebrow">Contacto</p>
            <h1>¿Tienes un proyecto en mente?</h1>
            <p class="intro">Escríbeme y hablemos.</p>
            <p>También puedes encontrarme en <a href="https://github.com/ares-linux" target="_blank" rel="noopener noreferrer">GitHub: ares-linux</a>.</p>

            <form action="mailto:aresbrandongo@gmail.com" method="post" enctype="text/plain">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" autocomplete="name" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="message">Mensaje</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button class="button" type="submit">Enviar mensaje</button>
            </form>
            <p><a href="index.html">Volver al inicio</a></p>
        </section>
    </main>
</body>
</html>
